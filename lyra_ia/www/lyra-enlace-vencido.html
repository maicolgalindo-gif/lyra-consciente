<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Este enlace ya no sirve</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500&display=swap" rel="stylesheet">
<style>
	:root { --porcelana: #f3f5f8; --tinta: #1b2a4a; --niebla: #8a97b4; }
	html, body { margin: 0; height: 100%; background: var(--porcelana);
		font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: var(--tinta); }
	main { max-width: 30rem; margin: 0 auto; padding: 22vh 24px 0; }
	h1 { font-size: 30px; font-weight: 400; line-height: 1.2; letter-spacing: -.4px; margin: 0 0 14px; }
	p { color: var(--niebla); font-size: 16px; line-height: 1.55; margin: 0; }
</style>
</head>
<body>
<main>
	<h1>Este enlace ya no sirve.</h1>
	<p>Puede que se haya vencido o que lo hayan cambiado. Pídele uno nuevo a quien te lo mandó
	   y seguimos la conversación donde la dejaste.</p>
</main>
</body>
</html>
