[project]
name = "lyra_ia"
authors = [{ name = "Algoritmia Labs", email = "maicol.galindo@devshouse.org" }]
description = "Inteligencia artificial de Lyra: cerebro LLM (DeepSeek u otro compatible), registro de uso y clasificaciones para todo el CRM."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
